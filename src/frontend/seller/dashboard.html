<!DOCTYPE html>
<html class="light" lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Dashboard Penjual - KantinKu</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
tailwind.config={darkMode:"class",theme:{extend:{colors:{"primary":"#ab3500","on-primary":"#ffffff","primary-container":"#ff6b35","on-primary-container":"#5f1900","secondary":"#24619d","on-secondary":"#ffffff","secondary-container":"#87bcfe","tertiary":"#006d3e","on-tertiary":"#ffffff","tertiary-container":"#00b067","error":"#ba1a1a","on-error":"#ffffff","error-container":"#ffdad6","background":"#f7f9fc","on-background":"#191c1e","surface":"#f7f9fc","on-surface":"#191c1e","surface-variant":"#e0e3e6","on-surface-variant":"#594139","outline":"#8d7168","outline-variant":"#e1bfb5","surface-dim":"#d8dadd","surface-container-lowest":"#ffffff","surface-container-low":"#f2f4f7","surface-container":"#eceef1","surface-container-high":"#e6e8eb","surface-container-highest":"#e0e3e6","inverse-surface":"#2d3133","inverse-on-surface":"#eff1f4","inverse-primary":"#ffb59d"},fontFamily:{sans:["Inter","sans-serif"]}}}}
</script>
<style>
  .tab-btn.active{color:#ab3500;border-color:#ab3500;background:rgba(171,53,0,.05)}
  .toggle-switch{position:relative;width:44px;height:24px;background:#e0e3e6;border-radius:12px;cursor:pointer;transition:background .3s}
  .toggle-switch.active{background:#006d3e}
  .toggle-switch::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:white;border-radius:50%;transition:transform .3s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .toggle-switch.active::after{transform:translateX(20px)}
</style>
</head>
<body class="bg-surface-container-low min-h-screen font-sans">
<div class="flex min-h-screen">
  <!-- Sidebar (Desktop) -->
  <aside class="hidden md:flex flex-col w-64 bg-inverse-surface text-inverse-on-surface flex-shrink-0 sticky top-0 h-screen overflow-y-auto">
    <div class="p-6 border-b border-white/10">
      <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-inverse-primary text-[28px]" style="font-variation-settings:'FILL' 1">restaurant</span>
        <span class="text-xl font-bold text-inverse-primary">KantinKu</span>
      </div>
      <p class="text-xs text-inverse-on-surface/60 mt-1">Dashboard Penjual</p>
    </div>
    <nav class="flex-1 py-4 space-y-1 px-3" id="sidebar-nav">
      <button onclick="switchTab('dashboard')" data-tab="dashboard" class="tab-btn active w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition hover:bg-white/5">
        <span class="material-symbols-outlined text-[20px]">dashboard</span>Dashboard
      </button>
      <button onclick="switchTab('catalog')" data-tab="catalog" class="tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition hover:bg-white/5">
        <span class="material-symbols-outlined text-[20px]">restaurant_menu</span>Katalog Menu
      </button>
      <button onclick="switchTab('queue')" data-tab="queue" class="tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition hover:bg-white/5">
        <span class="material-symbols-outlined text-[20px]">receipt_long</span>Antrian
      </button>
      <button onclick="switchTab('reports')" data-tab="reports" class="tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition hover:bg-white/5">
        <span class="material-symbols-outlined text-[20px]">bar_chart</span>Laporan
      </button>
      <button onclick="switchTab('settings')" data-tab="settings" class="tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition hover:bg-white/5">
        <span class="material-symbols-outlined text-[20px]">settings</span>Pengaturan
      </button>
    </nav>
    <div class="p-4 border-t border-white/10">
      <button onclick="logout()" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium text-red-400 hover:bg-red-500/10 transition">
        <span class="material-symbols-outlined text-[20px]">logout</span>Keluar
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col">
    <!-- Mobile Top Nav -->
    <header class="md:hidden sticky top-0 z-40 bg-surface/80 backdrop-blur-xl border-b border-surface-container-high">
      <div class="px-4 h-14 flex items-center justify-between">
        <span class="text-lg font-bold text-primary">KantinKu Seller</span>
        <button onclick="logout()" class="p-2 text-error"><span class="material-symbols-outlined">logout</span></button>
      </div>
      <div class="flex overflow-x-auto gap-1 px-3 pb-2" id="mobile-tabs">
        <button onclick="switchTab('dashboard')" data-tab="dashboard" class="tab-btn active whitespace-nowrap px-3 py-1.5 text-xs font-semibold rounded-full border border-transparent transition">Dashboard</button>
        <button onclick="switchTab('catalog')" data-tab="catalog" class="tab-btn whitespace-nowrap px-3 py-1.5 text-xs font-semibold rounded-full border border-transparent transition">Katalog</button>
        <button onclick="switchTab('queue')" data-tab="queue" class="tab-btn whitespace-nowrap px-3 py-1.5 text-xs font-semibold rounded-full border border-transparent transition">Antrian</button>
        <button onclick="switchTab('reports')" data-tab="reports" class="tab-btn whitespace-nowrap px-3 py-1.5 text-xs font-semibold rounded-full border border-transparent transition">Laporan</button>
        <button onclick="switchTab('settings')" data-tab="settings" class="tab-btn whitespace-nowrap px-3 py-1.5 text-xs font-semibold rounded-full border border-transparent transition">Setting</button>
      </div>
    </header>

    <!-- Tab Contents -->
    <main class="flex-1 p-4 md:p-8 overflow-y-auto">
      <!-- Dashboard -->
      <div id="tab-dashboard" class="tab-content">
        <div class="flex items-center justify-between mb-1">
          <h2 class="text-xl font-bold text-on-surface" id="welcome-msg">Dashboard</h2>
          <div class="flex items-center gap-2">
            <span class="text-sm font-semibold text-on-surface" id="store-status-text">Buka</span>
            <div id="store-status-toggle" class="toggle-switch" onclick="toggleStoreStatus()"></div>
          </div>
        </div>
        <p class="text-sm text-on-surface-variant mb-6">Ringkasan hari ini</p>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8" id="dashboard-stats"></div>
        <h3 class="text-sm font-bold text-on-surface mb-3">Pesanan Terbaru</h3>
        <div id="dashboard-recent" class="space-y-3"></div>
      </div>

      <!-- Catalog -->
      <div id="tab-catalog" class="tab-content hidden">
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-xl font-bold text-on-surface">Katalog Menu</h2>
          <button onclick="openMenuModal()" class="bg-primary text-on-primary px-4 py-2 rounded-xl text-sm font-semibold hover:bg-on-primary-container transition flex items-center gap-1.5">
            <span class="material-symbols-outlined text-[18px]">add</span>Tambah Menu
          </button>
        </div>
        <div id="catalog-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      </div>

      <!-- Queue -->
      <div id="tab-queue" class="tab-content hidden">
        <h2 class="text-xl font-bold text-on-surface mb-4">Antrian Pesanan</h2>
        <div class="flex gap-2 mb-4">
          <button onclick="switchQueueTab('active')" id="queue-tab-active" class="px-4 py-1.5 rounded-full text-sm font-semibold bg-primary text-on-primary transition">Aktif</button>
          <button onclick="switchQueueTab('history')" id="queue-tab-history" class="px-4 py-1.5 rounded-full text-sm font-semibold bg-surface-container text-on-surface-variant transition">Riwayat</button>
        </div>
        <div id="queue-container" class="space-y-4"></div>
      </div>

      <!-- Reports -->
      <div id="tab-reports" class="tab-content hidden">
        <h2 class="text-xl font-bold text-on-surface mb-4">Laporan Pendapatan</h2>
        <div class="flex gap-2 mb-6">
          <button onclick="loadReport('daily')" id="report-daily" class="px-4 py-1.5 rounded-full text-sm font-semibold bg-primary text-on-primary transition">Harian</button>
          <button onclick="loadReport('weekly')" id="report-weekly" class="px-4 py-1.5 rounded-full text-sm font-semibold bg-surface-container text-on-surface-variant transition">Mingguan</button>
          <button onclick="loadReport('monthly')" id="report-monthly" class="px-4 py-1.5 rounded-full text-sm font-semibold bg-surface-container text-on-surface-variant transition">Bulanan</button>
        </div>
        <div id="report-stats" class="grid grid-cols-1 sm:grid-cols-3 gap-4"></div>
      </div>

      <!-- Settings -->
      <div id="tab-settings" class="tab-content hidden">
        <h2 class="text-xl font-bold text-on-surface mb-6">Pengaturan Warung</h2>
        <div class="max-w-lg space-y-5" id="settings-form"></div>
      </div>
    </main>
  </div>
</div>

<!-- Menu Modal -->
<div id="menu-modal" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="bg-surface rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
    <div class="px-6 py-4 border-b border-surface-container flex items-center justify-between">
      <h3 id="menu-modal-title" class="font-bold text-on-surface">Tambah Menu</h3>
      <button onclick="closeMenuModal()" class="p-1 hover:bg-surface-container rounded-full"><span class="material-symbols-outlined">close</span></button>
    </div>
    <form id="menu-form" class="px-6 py-5 space-y-4">
      <input type="hidden" id="menu-edit-id"/>
      <div>
        <label class="block text-xs font-medium text-on-surface mb-1">Nama Menu *</label>
        <input id="menu-name" type="text" required placeholder="Nasi Goreng Spesial" class="w-full px-3 py-2 border border-surface-container-highest rounded-lg text-sm bg-surface focus:ring-2 focus:ring-primary transition"/>
      </div>
      <div>
        <label class="block text-xs font-medium text-on-surface mb-1">Harga (Rp) *</label>
        <input id="menu-price" type="number" required min="0" placeholder="15000" class="w-full px-3 py-2 border border-surface-container-highest rounded-lg text-sm bg-surface focus:ring-2 focus:ring-primary transition"/>
      </div>
      <div>
        <label class="block text-xs font-medium text-on-surface mb-1">Foto Menu</label>
        <input id="menu-photo" type="file" accept="image/*" class="w-full text-sm file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-primary/10 file:text-primary file:font-medium file:cursor-pointer"/>
        <div id="menu-photo-preview" class="mt-2 hidden">
          <img id="menu-photo-img" class="w-20 h-20 rounded-lg object-cover"/>
        </div>
      </div>
      <button type="submit" id="menu-save-btn" class="w-full bg-primary text-on-primary font-semibold py-2.5 rounded-xl hover:bg-on-primary-container transition">
        Simpan Menu
      </button>
    </form>
  </div>
</div>

<script src="http://localhost:5000/socket.io/socket.io.js"></script>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/seller.js"></script>
</body></html>
