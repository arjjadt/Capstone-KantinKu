<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-4">
<!-- Decorative Background Graphic -->
<div class="fixed inset-0 z-0 overflow-hidden pointer-events-none opacity-20">
<div class="absolute -top-[20%] -right-[10%] w-[70%] h-[70%] rounded-full bg-gradient-to-tr from-primary/30 to-tertiary-container/10 blur-[100px]"></div>
<div class="absolute -bottom-[20%] -left-[10%] w-[60%] h-[60%] rounded-full bg-gradient-to-tr from-secondary-container/20 to-primary-container/20 blur-[100px]"></div>
</div>
<!-- Login Card -->
<main class="w-full max-w-[440px] bg-surface rounded-xl shadow-[0_20px_25px_rgba(0,78,137,0.15)] z-10 overflow-hidden relative">
<!-- Header Section -->
<header class="pt-8 pb-6 px-8 text-center border-b border-surface-container">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary-container/20 mb-4 text-primary">
<span class="material-symbols-outlined text-4xl" data-icon="restaurant" style="font-variation-settings: 'FILL' 1;">restaurant</span>
</div>
<h1 class="text-headline-lg-mobile md:text-headline-lg font-headline-lg-mobile md:font-headline-lg text-primary mb-2">
                KantinKu
            </h1>
<p class="text-body-md font-body-md text-on-surface-variant">
                Pesan sekarang, ambil tanpa antre
            </p>
</header>
<!-- Form Section -->
<div class="p-8">
<form action="#" class="space-y-6" method="POST">
<!-- Username Field -->
<div>
<label class="block text-label-sm font-label-sm text-on-surface mb-1.5" for="username">
                        Username
                    </label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant" data-icon="person">person</span>
</div>
<input class="block w-full pl-10 pr-3 py-2.5 border border-surface-container-highest rounded-lg text-body-md font-body-md text-on-surface bg-surface placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow shadow-[0_2px_4px_rgba(0,78,137,0.05)]" id="username" name="username" placeholder="Enter your username" required="" type="text"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block text-label-sm font-label-sm text-on-surface mb-1.5" for="password">
                        Password
                    </label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-2.5 border border-surface-container-highest rounded-lg text-body-md font-body-md text-on-surface bg-surface placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow shadow-[0_2px_4px_rgba(0,78,137,0.05)]" id="password" name="password" placeholder="Enter your password" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex items-center justify-end">
<a class="text-label-sm font-label-sm text-primary hover:text-on-primary-container transition-colors" href="#">
                        Forgot Password?
                    </a>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary hover:bg-on-primary-container text-on-primary text-label-md font-label-md py-3 px-4 rounded-lg shadow-[0_10px_15px_rgba(0,78,137,0.1)] hover:shadow-[0_20px_25px_rgba(0,78,137,0.15)] transition-all flex items-center justify-center gap-2" type="submit">
                    Login
                    <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>

<!-- Demo Quick Login Buttons -->
<div class="mt-6 pt-4 border-t border-surface-container">
  <p class="text-xs font-semibold text-center text-outline mb-2.5">AKSES CEPAT DEMO</p>
  <div class="grid grid-cols-3 gap-2">
    <button type="button" onclick="quickLogin('adrian')" class="py-2 px-1 bg-surface-container hover:bg-primary-container/20 hover:text-primary rounded-lg text-xs font-semibold text-on-surface transition text-center border border-surface-container-highest">
      🛒 Pembeli
    </button>
    <button type="button" onclick="quickLogin('pakjoko')" class="py-2 px-1 bg-surface-container hover:bg-tertiary-container/20 hover:text-tertiary rounded-lg text-xs font-semibold text-on-surface transition text-center border border-surface-container-highest">
      🏪 Penjual
    </button>
    <button type="button" onclick="quickLogin('admin')" class="py-2 px-1 bg-surface-container hover:bg-secondary-container/20 hover:text-secondary rounded-lg text-xs font-semibold text-on-surface transition text-center border border-surface-container-highest">
      🛡️ Admin
    </button>
  </div>
</div>
<script>
  function quickLogin(username) {
    document.getElementById('username').value = username;
    document.getElementById('password').value = 'password123';
    document.querySelector('form button[type="submit"]').click();
  }
</script>

<!-- Register Link -->
<div class="mt-6 text-center">
  <p class="text-body-md font-body-md text-on-surface-variant">
    Belum punya akun? 
    <a id="btn-to-register" class="text-primary font-bold hover:underline decoration-2 underline-offset-4 cursor-pointer inline-flex items-center gap-1" href="register.html">
      Daftar di sini
      <span class="material-symbols-outlined text-[16px]">person_add</span>
    </a>
  </p>
</div>
</div>
</main>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
