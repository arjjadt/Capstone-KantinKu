<!DOCTYPE html>
<html class="light" lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Daftar - KantinKu</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
tailwind.config = {
  darkMode: "class",
  theme: { extend: {
    colors: {
      "primary":"#ab3500","on-primary":"#ffffff","primary-container":"#ff6b35",
      "on-primary-container":"#5f1900","secondary":"#24619d","on-secondary":"#ffffff",
      "secondary-container":"#87bcfe","tertiary":"#006d3e","on-tertiary":"#ffffff",
      "tertiary-container":"#00b067","error":"#ba1a1a","on-error":"#ffffff",
      "error-container":"#ffdad6","background":"#f7f9fc","on-background":"#191c1e",
      "surface":"#f7f9fc","on-surface":"#191c1e","surface-variant":"#e0e3e6",
      "on-surface-variant":"#594139","outline":"#8d7168","outline-variant":"#e1bfb5",
      "surface-dim":"#d8dadd","surface-container-lowest":"#ffffff",
      "surface-container-low":"#f2f4f7","surface-container":"#eceef1",
      "surface-container-high":"#e6e8eb","surface-container-highest":"#e0e3e6",
      "inverse-surface":"#2d3133","inverse-on-surface":"#eff1f4","inverse-primary":"#ffb59d",
    },
    fontFamily: { sans: ["Inter","sans-serif"] },
  }},
}
</script>
</head>
<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-4">
<!-- Background -->
<div class="fixed inset-0 z-0 overflow-hidden pointer-events-none opacity-20">
  <div class="absolute -top-[20%] -right-[10%] w-[70%] h-[70%] rounded-full bg-gradient-to-tr from-primary/30 to-tertiary-container/10 blur-[100px]"></div>
  <div class="absolute -bottom-[20%] -left-[10%] w-[60%] h-[60%] rounded-full bg-gradient-to-tr from-secondary-container/20 to-primary-container/20 blur-[100px]"></div>
</div>
<!-- Card -->
<main class="w-full max-w-[480px] bg-surface rounded-xl shadow-[0_20px_25px_rgba(0,78,137,0.15)] z-10 overflow-hidden relative">
  <header class="pt-8 pb-5 px-8 text-center border-b border-surface-container">
    <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-primary-container/20 mb-3 text-primary">
      <span class="material-symbols-outlined text-3xl" style="font-variation-settings:'FILL' 1;">person_add</span>
    </div>
    <h1 class="text-2xl font-bold text-primary mb-1">Buat Akun</h1>
    <p class="text-sm text-on-surface-variant">Daftar untuk mulai pre-order makanan</p>
  </header>

  <div class="p-8">
    <!-- Info -->
    <div class="bg-secondary/5 border border-secondary/20 rounded-lg p-3 mb-6 flex gap-2">
      <span class="material-symbols-outlined text-secondary text-[18px] mt-0.5">info</span>
      <p class="text-xs text-on-surface-variant">Anda akan terdaftar sebagai <strong class="text-secondary">Pembeli (Buyer)</strong>. Untuk berjualan, ajukan pendaftaran warung setelah login.</p>
    </div>

    <form action="#" method="POST" class="space-y-4">
      <!-- Username -->
      <div>
        <label class="block text-xs font-semibold text-on-surface mb-1" for="username">Username *</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <span class="material-symbols-outlined text-outline-variant text-[20px]">alternate_email</span>
          </div>
          <input id="username" name="username" type="text" required placeholder="Username unik (tanpa spasi)"
            class="block w-full pl-10 pr-3 py-2.5 border border-surface-container-highest rounded-lg text-sm bg-surface focus:ring-2 focus:ring-primary focus:border-primary transition"/>
        </div>
      </div>
      <!-- Full Name -->
      <div>
        <label class="block text-xs font-semibold text-on-surface mb-1" for="full_name">Nama Lengkap *</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <span class="material-symbols-outlined text-outline-variant text-[20px]">badge</span>
          </div>
          <input id="full_name" name="full_name" type="text" required placeholder="Nama lengkap Anda"
            class="block w-full pl-10 pr-3 py-2.5 border border-surface-container-highest rounded-lg text-sm bg-surface focus:ring-2 focus:ring-primary focus:border-primary transition"/>
        </div>
      </div>
      <!-- Email -->
      <div>
        <label class="block text-xs font-semibold text-on-surface mb-1" for="email">Email *</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <span class="material-symbols-outlined text-outline-variant text-[20px]">mail</span>
          </div>
          <input id="email" name="email" type="email" required placeholder="email@contoh.com"
            class="block w-full pl-10 pr-3 py-2.5 border border-surface-container-highest rounded-lg text-sm bg-surface focus:ring-2 focus:ring-primary focus:border-primary transition"/>
        </div>
      </div>
      <!-- Phone -->
      <div>
        <label class="block text-xs font-semibold text-on-surface mb-1" for="phone">Nomor Telepon <span class="text-outline-variant font-normal">(opsional)</span></label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <span class="material-symbols-outlined text-outline-variant text-[20px]">phone</span>
          </div>
          <input id="phone" name="phone" type="tel" placeholder="08xxxxxxxxxx"
            class="block w-full pl-10 pr-3 py-2.5 border border-surface-container-highest rounded-lg text-sm bg-surface focus:ring-2 focus:ring-primary focus:border-primary transition"/>
        </div>
      </div>
      <!-- Password -->
      <div>
        <label class="block text-xs font-semibold text-on-surface mb-1" for="password">Password *</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <span class="material-symbols-outlined text-outline-variant text-[20px]">lock</span>
          </div>
          <input id="password" name="password" type="password" required placeholder="Minimal 6 karakter"
            class="block w-full pl-10 pr-10 py-2.5 border border-surface-container-highest rounded-lg text-sm bg-surface focus:ring-2 focus:ring-primary focus:border-primary transition"/>
          <button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline-variant hover:text-primary transition" type="button">
            <span class="material-symbols-outlined text-[20px]">visibility</span>
          </button>
        </div>
      </div>
      <!-- Confirm Password -->
      <div>
        <label class="block text-xs font-semibold text-on-surface mb-1" for="confirm_password">Konfirmasi Password *</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <span class="material-symbols-outlined text-outline-variant text-[20px]">lock_reset</span>
          </div>
          <input id="confirm_password" name="confirm_password" type="password" required placeholder="Ulangi password"
            class="block w-full pl-10 pr-10 py-2.5 border border-surface-container-highest rounded-lg text-sm bg-surface focus:ring-2 focus:ring-primary focus:border-primary transition"/>
          <button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline-variant hover:text-primary transition" type="button">
            <span class="material-symbols-outlined text-[20px]">visibility</span>
          </button>
        </div>
      </div>
      <!-- Submit -->
      <button type="submit" class="w-full bg-primary hover:bg-on-primary-container text-on-primary text-sm font-semibold py-3 px-4 rounded-lg shadow-lg hover:shadow-xl transition-all flex items-center justify-center gap-2 mt-2">
        Daftar Sekarang
        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
      </button>
    </form>
    <div class="mt-6 text-center">
      <p class="text-sm text-on-surface-variant">Sudah punya akun? <a class="text-primary font-semibold hover:underline decoration-2 underline-offset-4" href="login.html">Login di sini</a></p>
    </div>
  </div>
</main>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body></html>
